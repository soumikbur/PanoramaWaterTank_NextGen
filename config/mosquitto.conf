# Mosquitto Configuration for Panorama Water Tank Monitor

# General listener (Plaintext for local docker / dev)
listener 1883 0.0.0.0
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Max payload size (64 KB)
max_packet_size 65536

# Message queuing
max_queued_messages 1000

