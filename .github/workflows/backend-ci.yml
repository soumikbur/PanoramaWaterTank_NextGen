name: CI & GitHub Pages Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Backend Tests & Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Test Suite
        working-directory: backend
        run: |
          python -m pytest tests/ -v --tb=short > pytest_log.txt 2>&1 || test_failed=1
          cat pytest_log.txt
          echo "### Pytest Test Execution Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat pytest_log.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ "$test_failed" = "1" ]; then
            echo "Pytest test suite failed!"
            exit 1
          fi

      - name: Validate OpenAPI Schema Generation
        working-directory: backend
        run: |
          python -c "from app.main import app; schema = app.openapi(); print('Validated OpenAPI paths:', len(schema['paths']))"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend Application
        run: npm run build

      - name: Verify Static Build Artifacts
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -f dist/404.html || { echo "dist/404.html missing"; exit 1; }
          test -d dist/assets || { echo "dist/assets missing"; exit 1; }
          echo "Static frontend build verified successfully."

      - name: Setup GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v4

      - name: Upload GitHub Pages Artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    name: Deploy to GitHub Pages
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
